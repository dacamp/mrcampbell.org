<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        @font-face {
            font-family: 'Canela';
            src: url('fonts/Canela-Light-Web.woff2') format('woff2');
            font-weight: 300;
            font-style: normal;
        }
        @font-face {
            font-family: 'Canela';
            src: url('fonts/Canela-Bold-Web.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
        }
        body {
            width: 1200px;
            height: 630px;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Canela', Georgia, serif;
            overflow: hidden;
            position: relative;
        }
        .border-accent {
            position: absolute;
            top: 24px; left: 24px; right: 24px; bottom: 24px;
            border: 1px solid rgba(201, 168, 76, 0.15);
        }
        .content {
            text-align: center;
            color: white;
            z-index: 1;
        }
        .label {
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 13px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #c9a84c;
            margin-bottom: 32px;
        }
        .name {
            font-size: 72px;
            font-weight: 300;
            letter-spacing: -0.01em;
            line-height: 1.1;
            margin-bottom: 24px;
        }
        .rule {
            width: 40px;
            height: 2px;
            background: #c9a84c;
            margin: 0 auto 24px;
        }
        .title {
            font-size: 22px;
            font-weight: 300;
            color: rgba(255,255,255,0.5);
            letter-spacing: 0.02em;
        }
        .domain {
            position: absolute;
            bottom: 40px;
            right: 48px;
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 13px;
            letter-spacing: 0.15em;
            color: rgba(255,255,255,0.25);
            text-transform: uppercase;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="border-accent"></div>
    <div class="content">
        <div class="label">AI Security Advisory</div>
        <div class="name">David Campbell</div>
        <div class="rule"></div>
        <div class="title">Advisor to Governments & Fortune 100 Enterprises</div>
    </div>
    <div class="domain">mrcampbell.org</div>
</body>
</html>
